<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    
    <title>Safymilk | ERP System</title>
    <meta name="description" content="Eco Water Company - Professional Boshqaruv Tizimi" />
    <meta name="theme-color" content="#4f46e5" /> <link rel="icon" href="/public/safymilk_logo_4.jpg" />
    <link rel="apple-touch-icon" href="/public/safymilk_logo_4.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    
    <link 
      rel="stylesheet" 
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" 
      integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" 
      crossorigin="anonymous" 
      referrerpolicy="no-referrer" 
    />

    <style>
      #loading-wrapper {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: #f8fafc;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }
      .dark #loading-wrapper {
        background-color: #0f172a;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #e2e8f0;
        border-top-color: #4f46e5; /* Indigo-600 999 */
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .brand-text {
        margin-top: 15px;
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        color: #475569;
        font-size: 14px;
        letter-spacing: 0.5px;
      }
      .dark .brand-text { color: #94a3b8; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>

  <body class="font-inter bg-slate-100 dark:bg-slate-900 text-slate-600 dark:text-slate-400 antialiased overflow-hidden">
    
    <script>
      (function() {
        // Dark Mode tekshiruvi
        const userTheme = localStorage.getItem('theme');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        if (userTheme === 'dark' || (!userTheme && systemDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }

        // Sidebar holati
        const sidebarExpanded = localStorage.getItem('sidebar-expanded');
        if (sidebarExpanded === 'true') {
          document.body.classList.add('sidebar-expanded');
        }
      })();
      
    </script>

    <div id="app">
      <div id="loading-wrapper">
        <div class="spinner"></div>
        <div class="brand-text">Safymilk</div>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
